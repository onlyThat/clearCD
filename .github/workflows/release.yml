name: 发布版本

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 校验 tag 与 package.json 的 version 一致，避免发布版本号错位
      - name: 校验版本号
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "tag=$TAG_VERSION package.json=$PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag 版本 $TAG_VERSION 与 package.json 版本 $PKG_VERSION 不一致"
            exit 1
          fi

      # --publish never：交给下面的 action 发布，避免 electron-builder 自行发布导致冲突
      - name: 打包（安装版 / 免安装 / 绿色版）
        run: npm run dist -- --publish never

      # 只保留三个确定正确的产物，避免中文名在非 UTF-8 环境下产生的
      # 乱码文件（如 onlyThatLove-1.0.1-.exe）混入发布
      - name: 整理产物
        shell: bash
        run: |
          mkdir -p artifacts
          for f in dist/*-setup.exe dist/*-portable.exe dist/*-green.7z; do
            [ -f "$f" ] && cp "$f" artifacts/
          done
          echo "== 待发布文件 =="
          ls -lh artifacts
          COUNT=$(ls -1 artifacts | wc -l)
          if [ "$COUNT" -ne 3 ]; then
            echo "::error::预期 3 个产物，实际 $COUNT 个"
            exit 1
          fi

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: onlyThatLove-${{ github.ref_name }}
          path: artifacts/*
          if-no-files-found: error

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: onlyThatLove ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}